<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo | Mood Music Journey</title>
    <style>
        /* --- CSS Variables --- */
        :root {
            --bg-grad-1: #0a0a0a;
            --bg-grad-2: #1a1a1a;
            --text-color: #e0e0e0;
            --accent-color: #888888;
            --glass-bg: rgba(20, 20, 20, 0.45);
            --btn-bg: rgba(255, 255, 255, 0.05);
            --btn-hover: rgba(255, 255, 255, 0.15);
            
            /* Scroll Intensity Variables */
            --intensity: 1; 
            --anim-speed: 1; 
        }

        /* --- Animated Theme Colors (8 Moods) --- */
        body.theme-drift {
            --bg-grad-1: #0f172a; --bg-grad-2: #1e3a8a;
            --accent-color: #38bdf8; --glass-bg: rgba(15, 23, 42, 0.55);
        }
        body.theme-surge {
            --bg-grad-1: #450a0a; --bg-grad-2: #991b1b;
            --accent-color: #f87171; --glass-bg: rgba(69, 10, 10, 0.55);
        }
        body.theme-nostalgia {
            --bg-grad-1: #431407; --bg-grad-2: #9a3412;
            --accent-color: #fbbf24; --glass-bg: rgba(67, 20, 7, 0.55);
        }
        body.theme-focus {
            --bg-grad-1: #0f2027; --bg-grad-2: #203a43;
            --accent-color: #4facfe; --glass-bg: rgba(15, 32, 39, 0.65);
        }
        body.theme-cosmic {
            --bg-grad-1: #2e1065; --bg-grad-2: #581c87;
            --accent-color: #c084fc; --glass-bg: rgba(46, 16, 101, 0.55);
        }
        body.theme-cafe {
            --bg-grad-1: #451a03; --bg-grad-2: #78350f;
            --accent-color: #fdba74; --glass-bg: rgba(69, 26, 3, 0.55);
        }
        body.theme-ocean {
            --bg-grad-1: #001e36; --bg-grad-2: #004d7a;
            --accent-color: #00d2ff; --glass-bg: rgba(0, 30, 54, 0.65);
        }
        body.theme-nature {
            --bg-grad-1: #064e3b; --bg-grad-2: #047857;
            --accent-color: #34d399; --glass-bg: rgba(6, 78, 59, 0.55);
        }

        /* --- Base Styles & Animated Background --- */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }

        body {
            background: linear-gradient(270deg, var(--bg-grad-1), var(--bg-grad-2), var(--bg-grad-1));
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            color: var(--text-color);
            min-height: 100vh;
            min-height: 100dvh; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden; 
            transition: all 1.5s ease-in-out;
            padding: 1rem;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- Intro Cinematic Screen --- */
        #intro-screen {
            position: fixed; inset: 0; background: #050505; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 1.5s ease, visibility 1.5s ease;
        }
        #intro-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .intro-logo { font-size: clamp(2rem, 5vw, 3.5rem); letter-spacing: clamp(8px, 2vw, 15px); font-weight: 300; color: #fff; animation: introFade 2s ease-in-out infinite alternate; }
        @keyframes introFade { 0% { opacity: 0.2; text-shadow: 0 0 10px transparent, 0 0 20px transparent; transform: scale(0.98); } 100% { opacity: 1; text-shadow: 0 0 20px #fff, 0 0 40px var(--accent-color); transform: scale(1); } }

        /* --- Scroll Intensity UI Meter --- */
        #intensity-meter {
            position: fixed; right: 20px; top: 50%; transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-radius: 20px; padding: 1rem 0.6rem; display: flex; flex-direction: column; align-items: center;
            opacity: 0; transition: opacity 0.4s ease; z-index: 100; pointer-events: none;
        }
        #intensity-meter.visible { opacity: 1; }
        .meter-bar { width: 6px; height: 120px; background: rgba(255, 255, 255, 0.1); border-radius: 3px; margin-bottom: 8px; position: relative; overflow: hidden; }
        .meter-fill { position: absolute; bottom: 0; left: 0; width: 100%; height: 50%; background: var(--accent-color); transition: height 0.1s ease, background 1.2s; box-shadow: 0 0 10px var(--accent-color); }
        .meter-text { font-size: 0.7rem; font-weight: bold; color: var(--text-color); letter-spacing: 1px; text-transform: uppercase; }

        /* --- Particle Canvas --- */
        #bg-canvas { 
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; overflow: hidden;
            transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* --- Glassmorphism UI Card --- */
        .glass-card {
            background: var(--glass-bg); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 2.5rem 2rem;
            max-width: 700px; width: 100%; text-align: center; z-index: 10;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255,255,255,0.1);
            transition: background 1.5s ease, transform 0.5s ease;
            opacity: 0; transform: translateY(30px); animation: cardEntrance 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.8s;
        }
        @keyframes cardEntrance { to { opacity: 1; transform: translateY(0); } }

        /* --- Echo Visualizer with Soundwaves --- */
        .orb-container { 
            position: relative; width: clamp(60px, 10vw, 80px); height: clamp(60px, 10vw, 80px); margin: 0 auto 1.5rem; 
            transform: scale(var(--intensity)); transition: transform 0.2s ease-out; /* Responds to scroll */
        }
        .echo-orb {
            position: relative; width: 100%; height: 100%; border-radius: 50%; background: var(--accent-color);
            box-shadow: 0 0 30px var(--accent-color), inset 0 0 15px rgba(255,255,255,0.8);
            animation: pulse 3s infinite ease-in-out; transition: background 1.2s, box-shadow 1.2s; z-index: 2;
        }
        .soundwave {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; height: 100%;
            border-radius: 50%; border: 2px solid var(--accent-color); opacity: 0; z-index: 1; transition: border-color 1.2s;
        }
        body:not(:not([class])) .wave-1 { animation: ripple calc(2.5s * var(--anim-speed)) infinite ease-out; }
        body:not(:not([class])) .wave-2 { animation: ripple calc(2.5s * var(--anim-speed)) infinite ease-out calc(1.25s * var(--anim-speed)); }

        @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 60px var(--accent-color); } 100% { transform: scale(0.95); opacity: 0.8; } }
        @keyframes ripple { 0% { width: 100%; height: 100%; opacity: 0.8; } 100% { width: 350%; height: 350%; opacity: 0; } }

        /* --- Dialogue --- */
        .dialogue-box { min-height: 80px; margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: center; }
        #dialogue { font-size: clamp(1.1rem, 3vw, 1.4rem); font-weight: 300; line-height: 1.5; text-shadow: 0 2px 5px rgba(0,0,0,0.4); }
        .cursor { display: inline-block; width: 3px; height: 1.1em; background-color: var(--accent-color); vertical-align: text-bottom; animation: blink 1s step-end infinite; margin-left: 2px;}
        @keyframes blink { 50% { opacity: 0; } }

        /* --- Interactive Buttons --- */
        .mood-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.8rem;
            opacity: 0; transform: translateY(15px); transition: opacity 1s ease, transform 1s ease; pointer-events: none; margin-bottom: 0.5rem;
        }
        .mood-grid.visible { opacity: 1; transform: translateY(0); pointer-events: all; }

        button {
            background: var(--btn-bg); color: var(--text-color); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.8rem 0.5rem; font-size: clamp(0.9rem, 2vw, 1.05rem); border-radius: 14px; cursor: pointer; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 500;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        button:hover { background: var(--btn-hover); border-color: var(--accent-color); transform: translateY(-5px) scale(1.05); box-shadow: 0 10px 20px rgba(0,0,0,0.4), 0 0 15px var(--accent-color); color: #fff;}

        /* --- Spotify Player & Controls --- */
        #player-container { margin-top: 1.5rem; opacity: 0; height: 0; transition: opacity 1s ease; pointer-events: none; width: 100%; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        #player-container.visible { opacity: 1; height: 152px; pointer-events: all; }
        iframe { width: 100%; height: 100%; border: none; }
        
        .controls { margin-top: 1.5rem; opacity: 0; pointer-events: none; transition: opacity 1s ease; }
        .controls.visible { opacity: 1; pointer-events: all; }
        .btn-small { border: none; background: transparent; text-decoration: none; opacity: 0.6; padding: 0.6rem 1.2rem; font-size: 0.95rem; border-radius: 20px; transition: all 0.3s; border: 1px solid transparent; margin: 0 auto; cursor: pointer;}
        .btn-small:hover { opacity: 1; border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.05); transform: translateY(-2px); }

        /* --- Dynamic Particle Animations --- */
        .drop { position: absolute; background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.5)); width: 2px; animation: fall linear infinite; }
        @keyframes fall { to { transform: translateY(110vh); } }

        .ember { position: absolute; background: #ff4b2b; border-radius: 50%; box-shadow: 0 0 15px #ff416c; animation: rise ease-in infinite; }
        @keyframes rise { 0% { transform: translateY(110vh) scale(0.5); opacity: 1;} 100% { transform: translateY(-10vh) scale(1.5); opacity: 0;} }

        .orb { position: absolute; border-radius: 50%; filter: blur(15px); animation: float float-ease infinite alternate; mix-blend-mode: screen; }
        @keyframes float { 0% { transform: translateY(0) translateX(0); opacity: 0.1;} 100% { transform: translateY(-200px) translateX(100px); opacity: 0.5;} }

        .geo-shape { position: absolute; border: 1px solid rgba(255,255,255,0.2); animation: spinFloat linear infinite; }
        @keyframes spinFloat { 0% { transform: translateY(110vh) rotate(0deg); opacity: 0;} 20% { opacity: 0.5; } 80% { opacity: 0.5; } 100% { transform: translateY(-10vh) rotate(360deg); opacity: 0;} }

        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle ease-in-out infinite alternate; }
        @keyframes twinkle { 0% { opacity: 0.1; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.5); box-shadow: 0 0 15px white; } }

        .ocean-wave { position: absolute; bottom: -150vw; left: -50vw; width: 200vw; height: 200vw; background: rgba(255, 255, 255, 0.05); border-radius: 43%; transform-origin: 50% 48%; }
        .ocean-wave:nth-child(2) { background: rgba(0, 210, 255, 0.1); border-radius: 45%; }
        .ocean-wave:nth-child(3) { background: rgba(0, 77, 122, 0.2); border-radius: 40%; }
        @keyframes spinWave { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- Mobile Media Queries --- */
        @media (max-width: 650px) {
            .glass-card { padding: 2rem 1.5rem; }
            .mood-grid { grid-template-columns: repeat(2, 1fr); gap: 0.6rem; }
            .dialogue-box { min-height: 70px; }
            button { padding: 0.8rem 0.5rem; }
            #intensity-meter { right: 10px; padding: 0.8rem 0.4rem; }
        }
    </style>
</head>
<body>

    <div id="intro-screen">
        <div class="intro-logo">E C H O</div>
    </div>

    <div id="intensity-meter">
        <div class="meter-bar">
            <div class="meter-fill" id="meter-fill"></div>
        </div>
        <div class="meter-text">Vibe</div>
    </div>

    <div id="bg-canvas"></div>

    <div class="glass-card">
        
        <div class="orb-container">
            <div class="soundwave wave-1"></div>
            <div class="soundwave wave-2"></div>
            <div class="echo-orb"></div>
        </div>

        <div class="dialogue-box">
            <span id="dialogue"></span><span class="cursor"></span>
        </div>

        <div class="mood-grid" id="mood-options">
            <button onclick="setMood('drift')">🌧️ Drift</button>
            <button onclick="setMood('surge')">🔥 Surge</button>
            <button onclick="setMood('nostalgia')">🌅 Nostalgia</button>
            <button onclick="setMood('focus')">⚔️ Focus</button>
            <button onclick="setMood('cosmic')">🌌 Cosmic</button>
            <button onclick="setMood('cafe')">☕ Cafe</button>
            <button onclick="setMood('ocean')">🌊 Ocean</button>
            <button onclick="setMood('nature')">🌿 Nature</button>
        </div>

        <div id="player-container">
            <iframe id="spotify-player" src="" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>

        <div class="controls" id="controls">
            <button class="btn-small" onclick="resetJourney()">Change Frequency</button>
        </div>
    </div>

    <script>
        const introScreen = document.getElementById('intro-screen');
        const dialogueEl = document.getElementById('dialogue');
        const moodOptions = document.getElementById('mood-options');
        const controls = document.getElementById('controls');
        const playerContainer = document.getElementById('player-container');
        const spotifyPlayer = document.getElementById('spotify-player');
        const bgCanvas = document.getElementById('bg-canvas');
        let typingTimeout;

        // --- 100% REAL VALID SPOTIFY EMBEDS ---
        const moods = {
            drift: {
                theme: 'theme-drift', message: "Drifting away. Let the rain wash over you.", particle: 'rain',
                spotifySrc: "https://open.spotify.com/embed/playlist/37i9dQZF1DWWQRwui0ExPn?utm_source=generator&theme=0" // Lofi Beats
            },
            surge: {
                theme: 'theme-surge', message: "Energy engaged. Let's start the fire.", particle: 'embers',
                spotifySrc: "https://open.spotify.com/embed/playlist/37i9dQZF1DX76Wlfdnj7AP?utm_source=generator&theme=0" // Beast Mode Workout
            },
            nostalgia: {
                theme: 'theme-nostalgia', message: "Sunset vibes. Let the memories roll in.", particle: 'orbs', color: '#fbbf24',
                spotifySrc: "https://open.spotify.com/embed/playlist/37i9dQZF1DX0XUfTFmNBRM?utm_source=generator&theme=0" // Bollywood Mush
            },
            focus: {
                theme: 'theme-focus', message: "Dialing it in. Zero distractions.", particle: 'geo',
                spotifySrc: "https://open.spotify.com/embed/playlist/37i9dQZF1DWZeKCadgRdKQ?utm_source=generator&theme=0" // Deep Focus
            },
            cosmic: {
                theme: 'theme-cosmic', message: "Leaving orbit. Welcome to the galaxy.", particle: 'stars',
                spotifySrc: "https://open.spotify.com/embed/playlist/37i9dQZF1DXdLEN7aqioJC?utm_source=generator&theme=0" // Retrowave / Outrun
            },
            cafe: {
                theme: 'theme-cafe', message: "Warm mugs and acoustic guitars. Grab a seat.", particle: 'orbs', color: '#fdba74',
                spotifySrc: "https://open.spotify.com/embed/playlist/37i9dQZF1DWUNIrSzKgQPb?utm_source=generator&theme=0" // Acoustic Covers
            },
            ocean: {
                theme: 'theme-ocean', message: "Diving deep. Let the waves carry you.", particle: 'waves',
                spotifySrc: "https://open.spotify.com/embed/playlist/37i9dQZF1DX4WYpdVIPcmO?utm_source=generator&theme=0" // Chill Hits
            },
            nature: {
                theme: 'theme-nature', message: "Breathing in. Finding peace in the forest.", particle: 'orbs', color: '#34d399',
                spotifySrc: "https://open.spotify.com/embed/playlist/37i9dQZF1DZ06evO1alA2W?utm_source=generator&theme=0" // Nature Sounds
            }
        };

        // --- Interactive 3D Mouse Parallax Effect ---
        document.addEventListener("mousemove", (e) => {
            const x = (window.innerWidth - e.pageX * 2) / 90;
            const y = (window.innerHeight - e.pageY * 2) / 90;
            bgCanvas.style.transform = `translateX(${x}px) translateY(${y}px)`;
        });

        // --- Dynamic Particle Engine (Connected to Intensity Meter) ---
        function generateParticles(type, colorCode) {
            bgCanvas.innerHTML = ''; 
            
            if (type === 'waves') {
                for (let i = 0; i < 3; i++) {
                    const wave = document.createElement('div');
                    wave.className = 'ocean-wave';
                    // Base times: 12s, 16s, 20s mapped to CSS var(--anim-speed)
                    const baseTime = 12 + (i * 4);
                    wave.style.animation = `spinWave calc(${baseTime}s * var(--anim-speed)) infinite linear`;
                    bgCanvas.appendChild(wave);
                }
                return;
            }

            const isMobile = window.innerWidth < 650;
            let count = 0;
            if (type === 'rain') count = isMobile ? 60 : 120;
            if (type === 'embers') count = isMobile ? 40 : 70;
            if (type === 'orbs') count = isMobile ? 20 : 40;
            if (type === 'geo') count = isMobile ? 15 : 30;
            if (type === 'stars') count = isMobile ? 70 : 150;

            for (let i = 0; i < count; i++) {
                const el = document.createElement('div');
                const left = Math.random() * 100; 
                const duration = Math.random() * 4 + 3; 
                const delay = Math.random() * 5;

                if (type === 'rain') {
                    el.className = 'drop'; el.style.left = `${left}vw`; el.style.top = `${Math.random() * -100}px`;
                    el.style.height = `${Math.random() * 40 + 20}px`; 
                    el.style.animationDuration = `calc(${Math.random() * 1 + 0.5}s * var(--anim-speed))`; el.style.animationDelay = `${delay}s`;
                } else if (type === 'embers') {
                    el.className = 'ember'; el.style.left = `${left}vw`; el.style.bottom = `-20px`;
                    el.style.width = el.style.height = `${Math.random() * 6 + 2}px`; 
                    el.style.animationDuration = `calc(${duration}s * var(--anim-speed))`; el.style.animationDelay = `${delay}s`;
                } else if (type === 'orbs') {
                    el.className = 'orb'; el.style.left = `${left}vw`; el.style.top = `${Math.random() * 100}vh`;
                    el.style.width = el.style.height = `${Math.random() * 150 + 50}px`; el.style.background = colorCode;
                    el.style.opacity = Math.random() * 0.3 + 0.1; 
                    el.style.animationDuration = `calc(${duration * 2}s * var(--anim-speed))`; el.style.animationDelay = `${delay}s`;
                } else if (type === 'geo') {
                    el.className = 'geo-shape'; el.style.left = `${left}vw`;
                    const size = Math.random() * 30 + 10; el.style.width = el.style.height = `${size}px`;
                    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '4px'; 
                    el.style.animationDuration = `calc(${duration * 3}s * var(--anim-speed))`; el.style.animationDelay = `${delay}s`;
                } else if (type === 'stars') {
                    el.className = 'star'; el.style.left = `${left}vw`; el.style.top = `${Math.random() * 100}vh`;
                    el.style.width = el.style.height = `${Math.random() * 3 + 1}px`; 
                    el.style.animationDuration = `calc(${Math.random() * 2 + 1}s * var(--anim-speed))`; el.style.animationDelay = `${delay}s`;
                }
                bgCanvas.appendChild(el);
            }
        }

        // --- Scroll/Touch Controlled Intensity Engine ---
        let visualIntensity = 1.0; 
        let meterTimeout;
        const meterContainer = document.getElementById('intensity-meter');
        const meterFill = document.getElementById('meter-fill');

        function updateIntensity(change) {
            if (!playerContainer.classList.contains('visible')) return;

            visualIntensity += change;
            visualIntensity = Math.max(0.5, Math.min(1.5, visualIntensity));

            // Set CSS Variable for Orb Size
            document.documentElement.style.setProperty('--intensity', visualIntensity);
            
            // Set CSS Variable for Animation Speed (Inverse relation: higher intensity = lower duration = faster)
            const speedMultiplier = 2.0 - visualIntensity; 
            document.documentElement.style.setProperty('--anim-speed', `${speedMultiplier}`);

            // Update UI Meter
            const percentage = ((visualIntensity - 0.5) / 1.0) * 100;
            meterFill.style.height = `${percentage}%`;

            // Show Meter
            meterContainer.classList.add('visible');

            // Hide Meter after 1.5s
            clearTimeout(meterTimeout);
            meterTimeout = setTimeout(() => {
                meterContainer.classList.remove('visible');
            }, 1500);
        }

        window.addEventListener('wheel', (e) => {
            if (e.deltaY < 0) updateIntensity(0.05); // Scroll Up
            else updateIntensity(-0.05); // Scroll Down
        });

        let touchStartY = 0;
        window.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, {passive: true});
        window.addEventListener('touchmove', (e) => {
            const touchEndY = e.touches[0].clientY;
            const diff = touchStartY - touchEndY;
            if (Math.abs(diff) > 15) {
                if (diff > 0) updateIntensity(0.04); // Swipe Up
                else updateIntensity(-0.04); // Swipe Down
                touchStartY = touchEndY; 
            }
        }, {passive: true});

        // --- Core Application Functions ---
        function typeWriter(text, index = 0) {
            if (index === 0) { dialogueEl.innerHTML = ''; clearTimeout(typingTimeout); }
            if (index < text.length) {
                dialogueEl.innerHTML += text.charAt(index);
                typingTimeout = setTimeout(() => typeWriter(text, index + 1), 35);
            } else {
                if (!playerContainer.classList.contains('visible')) moodOptions.classList.add('visible');
            }
        }

        function setMood(moodKey) {
            const mood = moods[moodKey];
            
            // Reset Intensity
            visualIntensity = 1.0;
            document.documentElement.style.setProperty('--intensity', '1.0');
            document.documentElement.style.setProperty('--anim-speed', '1.0');

            document.body.className = mood.theme;
            generateParticles(mood.particle, mood.color);
            spotifyPlayer.src = mood.spotifySrc;

            localStorage.setItem('savedMood', moodKey);

            moodOptions.classList.remove('visible');
            playerContainer.classList.add('visible');
            controls.classList.add('visible');
            
            setTimeout(() => { typeWriter(mood.message); }, 300);
        }

        function resetJourney() {
            localStorage.removeItem('savedMood');
            document.body.className = '';
            bgCanvas.innerHTML = '';
            
            spotifyPlayer.src = ""; 
            playerContainer.classList.remove('visible');
            controls.classList.remove('visible');
            meterContainer.classList.remove('visible');
            
            typeWriter("Frequency cleared. What kind of space are you trying to create right now?");
        }

        function initJourney() {
            const previousMood = localStorage.getItem('savedMood');
            
            if (previousMood && moods[previousMood]) {
                const mood = moods[previousMood];
                document.body.className = mood.theme;
                spotifyPlayer.src = mood.spotifySrc;
                generateParticles(mood.particle, mood.color);
                
                playerContainer.classList.add('visible');
                controls.classList.add('visible');
                
                const formattedMood = previousMood.charAt(0).toUpperCase() + previousMood.slice(1);
                typeWriter(`Welcome back. Still riding that wave of ${formattedMood}, or are we changing the frequency today?`);
            } else {
                typeWriter("Hey there. I'm Echo. The world is a bit loud today. What kind of space are you trying to create right now?");
            }
        }

        window.addEventListener('load', () => {
            setTimeout(() => {
                introScreen.classList.add('hidden');
                setTimeout(initJourney, 800); 
            }, 2000); 
        });
    </script>
</body>
</html>
